services:
  db:
    image: postgres:16-alpine
    container_name: cardoo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardoo
      POSTGRES_PASSWORD: cardoo
      POSTGRES_DB: cardoo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardoo -d cardoo"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardoo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://cardoo:cardoo@db:5432/cardoo
    ports:
      - "3000:3000"

volumes:
  pgdata:
